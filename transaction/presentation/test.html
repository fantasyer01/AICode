<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presentation Test</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
            background: #F0F7FF;
            color: #333;
        }
        
        .slide {
            width: 100vw;
            height: 100vh;
            display: none;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px;
        }
        
        .slide.active {
            display: flex;
        }
        
        h1 {
            font-size: 3rem;
            color: #4A90E2;
            margin-bottom: 20px;
        }
        
        p {
            font-size: 1.5rem;
            color: #666;
        }
        
        .nav {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
        }
        
        button {
            padding: 10px 20px;
            background: #4A90E2;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        
        button:hover {
            background: #357ABD;
        }
        
        .indicator {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #4A90E2;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="indicator" id="indicator">1 / 3</div>
    
    <div class="slide active">
        <div>
            <h1>测试幻灯片 1</h1>
            <p>如果你能看到这个文字，说明基本渲染正常</p>
            <p style="margin-top: 20px;">点击"下一张"或按右箭头键</p>
        </div>
    </div>
    
    <div class="slide">
        <div>
            <h1>测试幻灯片 2</h1>
            <p>导航功能正常！</p>
            <p style="margin-top: 20px;">继续测试...</p>
        </div>
    </div>
    
    <div class="slide">
        <div>
            <h1>测试幻灯片 3</h1>
            <p>所有功能都正常工作！</p>
            <p style="margin-top: 20px;">现在可以使用完整版演示文稿了</p>
        </div>
    </div>
    
    <div class="nav">
        <button onclick="prev()">上一张</button>
        <button onclick="next()">下一张</button>
    </div>
    
    <script>
        let current = 0;
        const slides = document.querySelectorAll('.slide');
        const total = slides.length;
        
        function update() {
            slides.forEach((slide, i) => {
                slide.classList.toggle('active', i === current);
            });
            document.getElementById('indicator').textContent = `${current + 1} / ${total}`;
        }
        
        function next() {
            if (current < total - 1) {
                current++;
                update();
            }
        }
        
        function prev() {
            if (current > 0) {
                current--;
                update();
            }
        }
        
        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === ' ') {
                e.preventDefault();
                next();
            } else if (e.key === 'ArrowLeft') {
                e.preventDefault();
                prev();
            }
        });
        
        // Click to advance
        document.addEventListener('click', (e) => {
            if (!e.target.closest('button')) {
                next();
            }
        });
        
        console.log('Test presentation loaded successfully');
    </script>
</body>
</html>
