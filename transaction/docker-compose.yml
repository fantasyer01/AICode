version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: txdemo-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: txdemo
      MYSQL_USER: txdemo_user
      MYSQL_PASSWORD: txdemo_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - txdemo-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: txdemo-backend
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/txdemo?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: txdemo_user
      SPRING_DATASOURCE_PASSWORD: txdemo_pass
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - txdemo-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: txdemo-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - txdemo-network

volumes:
  mysql_data:

networks:
  txdemo-network:
    driver: bridge
