version: '3.8'

services:
  poetry-app:
    build: .
    container_name: chinese-poetry-app
    ports:
      - "9000:9000"
    volumes:
      # Persist logs to host
      - ./logs:/app/logs
    environment:
      - TZ=Asia/Shanghai
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
