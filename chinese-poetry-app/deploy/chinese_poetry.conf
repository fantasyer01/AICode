<VirtualHost *:80>
    ServerName 127.0.0.1
    DocumentRoot /home/lighthouse/chinese-poetry-app

    # ========================================
    # 流式响应超时配置（关键！）
    # ========================================
    
    # 1. Apache 全局超时设置
    Timeout 300
    KeepAlive On
    KeepAliveTimeout 300
    
    # 2. 代理超时设置（针对 Gunicorn）
    ProxyTimeout 300
    ProxyPreserveHost On
    
    # 3. 代理到 Gunicorn，禁用缓冲
    ProxyPass / http://127.0.0.1:8000/ timeout=300 disablereuse=Off
    ProxyPassReverse / http://127.0.0.1:8000/
    
    # 禁用代理缓冲（重要！确保流式数据实时传输）
    SetEnv proxy-nokeepalive 1
    SetEnv proxy-initial-not-pooled 1

    # ========================================
    # 静态文件配置
    # ========================================
    Alias /static /home/lighthouse/chinese-poetry-app/static
    <Directory /home/lighthouse/chinese-poetry-app/static>
        Require all granted
    </Directory>

    # ========================================
    # 日志配置
    # ========================================
    ErrorLog /usr/local/lighthouse/softwares/apache/logs/chinese-poetry-error.log
    CustomLog /usr/local/lighthouse/softwares/apache/logs/chinese-poetry-access.log combined
</VirtualHost>