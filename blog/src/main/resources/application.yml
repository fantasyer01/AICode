server:
  port: 9100

spring:
  application:
    name: ai-blog
  datasource:
    url: jdbc:h2:file:./data/aiblog;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    #database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
  h2:
    console:
      enabled: false
      path: /h2-console
      settings:
        web-allow-others: false
  thymeleaf:
    cache: false
  data:
    web:
      pageable:
        default-page-size: 10
        max-page-size: 50
  servlet:
    multipart:
      enabled: true
      max-file-size: 3MB
      max-request-size: 3MB

logging:
  config: classpath:logback-spring.xml

app:
  image:
    storage-dir: ./data/images
    url-prefix: /images
  admin:
    username: admin
    password: ${BLOG_ADMIN_PASSWORD}
  api:
    key: ${BLOG_API_KEY}
  deepseek:
    api-key: ${DEEPSEEK_API_KEY}
    base-url: https://api.deepseek.com
    model: deepseek-chat
