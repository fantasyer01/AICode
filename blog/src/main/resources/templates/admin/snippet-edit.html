<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/layout}">
<head>
    <title>Edit Snippet</title>
</head>
<body>
<div layout:fragment="content">

    <div class="max-w-3xl mx-auto">
        <h1 class="text-2xl font-bold text-gray-900 mb-6">Edit Snippet</h1>

        <!-- Error Message -->
        <div th:if="${error}" class="mb-4 p-3 rounded-lg bg-red-50 border border-red-200">
            <p class="text-sm text-red-600" th:text="${error}">Error</p>
        </div>

        <!-- Current Status -->
        <div class="mb-4 p-4 bg-gray-50 rounded-lg border border-gray-200">
            <div class="flex items-center gap-3 mb-2">
                <span class="text-sm font-medium text-gray-700">Status:</span>
                <span th:if="${snippet.status.name() == 'PROCESSED'}"
                      class="inline-block px-2 py-0.5 text-xs rounded-full bg-green-50 text-green-700">Processed</span>
                <span th:if="${snippet.status.name() == 'PENDING'}"
                      class="inline-block px-2 py-0.5 text-xs rounded-full bg-yellow-50 text-yellow-700">Pending</span>
                <span th:if="${snippet.status.name() == 'FAILED'}"
                      class="inline-block px-2 py-0.5 text-xs rounded-full bg-red-50 text-red-700">Failed</span>
            </div>
            <div th:if="${snippet.processedTitle != null}" class="mb-1">
                <span class="text-sm text-gray-500">Current Title:</span>
                <span class="text-sm text-gray-900 font-medium" th:text="${snippet.processedTitle}">Title</span>
            </div>
            <div th:if="${snippet.tags != null && !snippet.tags.isEmpty()}" class="flex items-center gap-1">
                <span class="text-sm text-gray-500">Tags:</span>
                <span th:each="tag : ${snippet.tags}" th:text="${tag}"
                      class="inline-block px-2 py-0.5 text-xs rounded-full bg-blue-50 text-blue-700"></span>
            </div>
        </div>

        <form th:action="@{'/admin/snippets/' + ${snippet.id} + '/edit'}" method="post" class="bg-white rounded-xl border border-gray-200 p-6 space-y-5">

            <div>
                <label for="author" class="block text-sm font-medium text-gray-700 mb-1">Author</label>
                <input type="text" id="author" name="author" maxlength="200"
                       th:value="${snippet.author}"
                       class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent">
            </div>

            <div>
                <label for="rawContent" class="block text-sm font-medium text-gray-700 mb-1">Raw Content <span class="text-red-500">*</span></label>
                <p class="text-xs text-gray-400 mb-2">Saving will re-trigger AI processing to generate a new title, content, and tags.</p>
                <textarea id="rawContent" name="rawContent" rows="12" required
                          th:text="${snippet.rawContent}"
                          class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm font-mono focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent"></textarea>
            </div>

            <div class="flex items-center gap-3 pt-2">
                <button type="submit"
                        class="px-5 py-2.5 bg-primary text-white text-sm font-medium rounded-lg hover:bg-primary-dark transition-colors">
                    Save & Re-process
                </button>
                <a th:href="@{/admin/snippets}"
                   class="px-5 py-2.5 text-sm text-gray-600 hover:text-gray-900 transition-colors">
                    Cancel
                </a>
            </div>
        </form>
    </div>

</div>
</body>
</html>
