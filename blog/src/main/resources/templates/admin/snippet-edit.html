<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/layout}">
<head>
    <title>Edit Snippet</title>
</head>
<body>
<div layout:fragment="content">

    <div class="max-w-5xl mx-auto">
        <h1 class="text-2xl font-bold text-gray-900 mb-6">Edit Snippet</h1>

        <!-- Success Message -->
        <div th:if="${success}" class="mb-4 p-3 rounded-lg bg-green-50 border border-green-200">
            <p class="text-sm text-green-600" th:text="${success}">Success</p>
        </div>

        <!-- Error Message -->
        <div th:if="${error}" class="mb-4 p-3 rounded-lg bg-red-50 border border-red-200">
            <p class="text-sm text-red-600" th:text="${error}">Error</p>
        </div>

        <!-- Current Status -->
        <div class="mb-4 p-4 bg-gray-50 rounded-lg border border-gray-200">
            <div class="flex items-center gap-3 mb-2">
                <span class="text-sm font-medium text-gray-700">Status:</span>
                <span th:if="${snippet.status.name() == 'PROCESSED'}"
                      class="inline-block px-2 py-0.5 text-xs rounded-full bg-green-50 text-green-700">Processed</span>
                <span th:if="${snippet.status.name() == 'PENDING'}"
                      class="inline-block px-2 py-0.5 text-xs rounded-full bg-yellow-50 text-yellow-700">Pending</span>
                <span th:if="${snippet.status.name() == 'FAILED'}"
                      class="inline-block px-2 py-0.5 text-xs rounded-full bg-red-50 text-red-700">Failed</span>
            </div>
            <div th:if="${snippet.tags != null && !snippet.tags.isEmpty()}" class="flex items-center gap-1">
                <span class="text-sm text-gray-500">Tags:</span>
                <span th:each="tag : ${snippet.tags}" th:text="${tag}"
                      class="inline-block px-2 py-0.5 text-xs rounded-full bg-blue-50 text-blue-700"></span>
            </div>
        </div>

        <!-- Edit Form -->
        <form th:action="@{'/admin/snippets/' + ${snippet.id} + '/edit'}" method="post" class="bg-white rounded-xl border border-gray-200 p-6 space-y-5">

            <div>
                <label for="author" class="block text-sm font-medium text-gray-700 mb-1">Author</label>
                <input type="text" id="author" name="author" maxlength="200"
                       th:value="${snippet.author}"
                       class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent">
            </div>

            <!-- Processed Title -->
            <div>
                <label for="processedTitle" class="block text-sm font-medium text-gray-700 mb-1">Processed Title</label>
                <input type="text" id="processedTitle" name="processedTitle" maxlength="500"
                       th:value="${snippet.processedTitle}"
                       class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent"
                       placeholder="AI-generated title">
            </div>

            <!-- Two-column layout for Raw Content and Processed Content -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                <div>
                    <label for="rawContent" class="block text-sm font-medium text-gray-700 mb-1">Raw Content <span class="text-red-500">*</span></label>
                    <p class="text-xs text-gray-400 mb-2">Original content before AI processing.</p>
                    <textarea id="rawContent" name="rawContent" rows="16" required
                              th:text="${snippet.rawContent}"
                              class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm font-mono focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent"></textarea>
                </div>
                <div>
                    <label for="processedContent" class="block text-sm font-medium text-gray-700 mb-1">Processed Content</label>
                    <p class="text-xs text-gray-400 mb-2">AI-structured content. Editable.</p>
                    <textarea id="processedContent" name="processedContent" rows="16"
                              th:text="${snippet.processedContent}"
                              class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm font-mono focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent"
                              placeholder="Will be generated by AI processing"></textarea>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="flex items-center gap-3 pt-2">
                <button type="submit"
                        class="px-5 py-2.5 bg-primary text-white text-sm font-medium rounded-lg hover:bg-primary-dark transition-colors">
                    Save
                </button>
                <button type="button" id="reprocessBtn"
                        class="px-5 py-2.5 bg-amber-500 text-white text-sm font-medium rounded-lg hover:bg-amber-600 transition-colors">
                    Reprocess
                </button>
                <a th:href="@{/admin/snippets}"
                   class="px-5 py-2.5 text-sm text-gray-600 hover:text-gray-900 transition-colors">
                    Cancel
                </a>
            </div>
        </form>

        <!-- Hidden Reprocess Form -->
        <form id="reprocessForm" th:action="@{'/admin/snippets/' + ${snippet.id} + '/reprocess'}" method="post" class="hidden"></form>
    </div>

    <!-- Reprocess Confirmation Modal -->
    <div id="reprocessModal" class="fixed inset-0 z-50 hidden">
        <!-- Backdrop -->
        <div id="modalBackdrop" class="absolute inset-0 bg-gray-900/40 backdrop-blur-sm transition-opacity duration-200 opacity-0"></div>
        <!-- Modal -->
        <div class="flex items-center justify-center min-h-full p-4">
            <div id="modalPanel" class="relative bg-white rounded-xl shadow-xl max-w-md w-full p-6 transform transition-all duration-200 scale-95 opacity-0">
                <div class="flex items-start gap-4">
                    <div class="flex-shrink-0 w-10 h-10 rounded-full bg-amber-50 flex items-center justify-center">
                        <svg class="w-5 h-5 text-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                  d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L4.082 16.5c-.77.833.192 2.5 1.732 2.5z"/>
                        </svg>
                    </div>
                    <div class="flex-1">
                        <h3 class="text-base font-semibold text-gray-900">确认重新处理</h3>
                        <p class="mt-2 text-sm text-gray-500 leading-relaxed">
                            此操作将重新调用 AI 对内容进行处理，当前的标题、结构化内容和标签将被<span class="font-medium text-gray-700">覆盖</span>，且无法撤销。
                        </p>
                    </div>
                </div>
                <div class="mt-6 flex justify-end gap-3">
                    <button type="button" id="modalCancelBtn"
                            class="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 transition-colors">
                        取消
                    </button>
                    <button type="button" id="modalConfirmBtn"
                            class="px-4 py-2 text-sm font-medium text-white bg-amber-500 rounded-lg hover:bg-amber-600 transition-colors">
                        确认
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="fixed inset-0 z-[60] hidden">
        <div class="absolute inset-0 bg-gray-900/50 backdrop-blur-sm"></div>
        <div class="flex items-center justify-center min-h-full">
            <div class="bg-white rounded-xl shadow-xl px-8 py-6 flex flex-col items-center gap-4">
                <svg class="animate-spin h-8 w-8 text-amber-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <p class="text-sm text-gray-600 font-medium">AI 正在重新处理中，请稍候...</p>
            </div>
        </div>
    </div>

    <script th:inline="javascript">
        (function() {
            var modal = document.getElementById('reprocessModal');
            var backdrop = document.getElementById('modalBackdrop');
            var panel = document.getElementById('modalPanel');
            var loadingOverlay = document.getElementById('loadingOverlay');

            function openModal() {
                modal.classList.remove('hidden');
                requestAnimationFrame(function() {
                    backdrop.classList.remove('opacity-0');
                    panel.classList.remove('scale-95', 'opacity-0');
                    panel.classList.add('scale-100', 'opacity-100');
                });
            }

            function closeModal() {
                backdrop.classList.add('opacity-0');
                panel.classList.remove('scale-100', 'opacity-100');
                panel.classList.add('scale-95', 'opacity-0');
                setTimeout(function() { modal.classList.add('hidden'); }, 200);
            }

            document.getElementById('reprocessBtn').addEventListener('click', openModal);
            document.getElementById('modalCancelBtn').addEventListener('click', closeModal);
            document.getElementById('modalBackdrop').addEventListener('click', closeModal);
            document.getElementById('modalConfirmBtn').addEventListener('click', function() {
                closeModal();
                setTimeout(function() {
                    loadingOverlay.classList.remove('hidden');
                    document.getElementById('reprocessForm').submit();
                }, 220);
            });

            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape' && !modal.classList.contains('hidden')) {
                    closeModal();
                }
            });
        })();
    </script>

</div>
</body>
</html>
