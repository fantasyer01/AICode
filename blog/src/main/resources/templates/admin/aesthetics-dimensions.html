<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/layout}">
<head>
    <title>Aesthetics Dimensions</title>
</head>
<body>
<div layout:fragment="content">

    <!-- Success/Error Message -->
    <div th:if="${success}" class="mb-4 p-3 rounded-lg bg-green-50 border border-green-200">
        <p class="text-sm text-green-600" th:text="${success}">Success</p>
    </div>
    <div th:if="${error}" class="mb-4 p-3 rounded-lg bg-red-50 border border-red-200">
        <p class="text-sm text-red-600" th:text="${error}">Error</p>
    </div>

    <!-- Header -->
    <div class="flex justify-between items-center mb-6">
        <h1 class="text-2xl font-bold text-gray-900">Aesthetics Dimensions</h1>
        <a th:href="@{/admin/aesthetics/dimensions/create}"
           class="px-4 py-2 bg-primary text-white text-sm font-medium rounded-lg hover:bg-primary-dark transition-colors">
            New Dimension
        </a>
    </div>

    <!-- Empty State -->
    <div th:if="${dimensions.isEmpty()}" class="text-center py-16 bg-white rounded-xl border border-gray-200">
        <p class="text-gray-500">No dimensions yet. Create your first dimension.</p>
    </div>

    <!-- Dimension Table -->
    <div th:unless="${dimensions.isEmpty()}" class="bg-white rounded-xl border border-gray-200 overflow-hidden">
        <table class="w-full text-sm">
            <thead class="bg-gray-50 border-b border-gray-200">
                <tr>
                    <th class="text-left px-4 py-3 font-medium text-gray-500">ID</th>
                    <th class="text-left px-4 py-3 font-medium text-gray-500">Name</th>
                    <th class="text-left px-4 py-3 font-medium text-gray-500">Type</th>
                    <th class="text-left px-4 py-3 font-medium text-gray-500">Order</th>
                    <th class="text-left px-4 py-3 font-medium text-gray-500">Description</th>
                    <th class="text-right px-4 py-3 font-medium text-gray-500">Actions</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-gray-100">
                <tr th:each="dim : ${dimensions}" class="hover:bg-gray-50">
                    <td class="px-4 py-3 text-gray-500" th:text="${dim.id}">1</td>
                    <td class="px-4 py-3 font-medium text-gray-900" th:text="${dim.name}">Name</td>
                    <td class="px-4 py-3">
                        <span th:text="${dim.type}"
                              th:classappend="${dim.type.name() == 'SENSORY'} ? 'bg-purple-50 text-purple-700' : 'bg-teal-50 text-teal-700'"
                              class="inline-block px-2 py-0.5 text-xs rounded-full">
                        </span>
                    </td>
                    <td class="px-4 py-3 text-gray-500" th:text="${dim.displayOrder}">0</td>
                    <td class="px-4 py-3 text-gray-500 truncate max-w-xs" th:text="${dim.description ?: '-'}">-</td>
                    <td class="px-4 py-3 text-right space-x-3">
                        <a th:href="@{'/admin/aesthetics/dimensions/' + ${dim.id} + '/edit'}"
                           class="text-primary hover:text-primary-dark transition-colors">Edit</a>
                        <a th:href="@{'/admin/aesthetics/dimensions/' + ${dim.id} + '/delete'}"
                           class="text-red-500 hover:text-red-700 transition-colors">Delete</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

</div>
</body>
</html>
