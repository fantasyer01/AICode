<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/layout}">
<head>
    <title>Edit Article</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/easymde/dist/easymde.min.css">
</head>
<body>
<div layout:fragment="content">

    <div class="max-w-3xl mx-auto">
        <h1 class="text-2xl font-bold text-gray-900 mb-6">Edit Article</h1>

        <!-- Error Message -->
        <div th:if="${error}" class="mb-4 p-3 rounded-lg bg-red-50 border border-red-200">
            <p class="text-sm text-red-600" th:text="${error}">Error</p>
        </div>

        <form th:action="@{'/admin/articles/' + ${article.id} + '/edit'}" method="post"
              class="bg-white rounded-xl border border-gray-200 p-6 space-y-5">

            <div>
                <label for="title" class="block text-sm font-medium text-gray-700 mb-1">Title <span class="text-red-500">*</span></label>
                <input type="text" id="title" name="title" required maxlength="500"
                       th:value="${article.title}"
                       class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent">
            </div>

            <div>
                <label for="author" class="block text-sm font-medium text-gray-700 mb-1">Author</label>
                <input type="text" id="author" name="author" maxlength="200"
                       th:value="${article.author}"
                       class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent">
            </div>

            <div>
                <label for="summary" class="block text-sm font-medium text-gray-700 mb-1">Summary</label>
                <textarea id="summary" name="summary" rows="2" maxlength="1000"
                          th:text="${article.summary}"
                          class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent"></textarea>
            </div>

            <div>
                <label for="category" class="block text-sm font-medium text-gray-700 mb-1">Category</label>
                <input type="text" id="category" name="category" maxlength="100"
                       th:value="${article.category}"
                       placeholder="e.g. Technology"
                       class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent">
            </div>

            <div>
                <label for="tags" class="block text-sm font-medium text-gray-700 mb-1">Tags <span class="text-gray-400 font-normal">(comma-separated)</span></label>
                <input type="text" id="tags" name="tags"
                       th:value="${tagsString}"
                       placeholder="e.g. spring,java,tutorial"
                       class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent">
            </div>

            <div>
                <label for="coverImageUrl" class="block text-sm font-medium text-gray-700 mb-1">Cover Image URL</label>
                <input type="text" id="coverImageUrl" name="coverImageUrl"
                       th:value="${article.coverImageUrl}"
                       placeholder="/images/xxx.png or https://example.com/image.png"
                       class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent">
                <p class="mt-1 text-xs text-gray-400">Upload an image first, then paste the URL here.</p>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Publish Status</label>
                <div class="flex items-center gap-4">
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="radio" name="published" value="true"
                               th:checked="${article.published == true}"
                               class="w-4 h-4 text-primary border-gray-300 focus:ring-primary">
                        <span class="text-sm text-gray-700">Published</span>
                    </label>
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="radio" name="published" value="false"
                               th:checked="${article.published == false}"
                               class="w-4 h-4 text-primary border-gray-300 focus:ring-primary">
                        <span class="text-sm text-gray-700">Draft</span>
                    </label>
                </div>
            </div>

            <div>
                <label for="content" class="block text-sm font-medium text-gray-700 mb-1">Content (Markdown) <span class="text-red-500">*</span></label>
                <textarea id="content" name="content" required
                          th:text="${article.content}"></textarea>
            </div>

            <div class="flex items-center gap-3 pt-2">
                <button type="submit"
                        class="px-5 py-2.5 bg-primary text-white text-sm font-medium rounded-lg hover:bg-primary-dark transition-colors">
                    Update
                </button>
                <a th:href="@{/admin}"
                   class="px-5 py-2.5 text-sm text-gray-600 hover:text-gray-900 transition-colors">
                    Cancel
                </a>
            </div>
        </form>
    </div>

</div>

<th:block layout:fragment="scripts">
<script src="https://cdn.jsdelivr.net/npm/easymde/dist/easymde.min.js"></script>
<script th:inline="javascript">
    const easyMDE = new EasyMDE({
        element: document.getElementById('content'),
        spellChecker: false,
        autosave: { enabled: false },
        toolbar: [
            'bold', 'italic', 'heading', '|',
            'quote', 'unordered-list', 'ordered-list', '|',
            'link', 'upload-image', '|',
            'preview', 'side-by-side', 'fullscreen', '|',
            'guide'
        ],
        uploadImage: true,
        imageUploadFunction: function(file, onSuccess, onError) {
            const formData = new FormData();
            formData.append('file', file);
            fetch('/api/images/upload', {
                method: 'POST',
                body: formData
            })
            .then(function(r) {
                if (!r.ok) throw new Error('Upload failed: ' + r.status);
                return r.json();
            })
            .then(function(data) { onSuccess(data.url); })
            .catch(function(err) { onError(err.message || 'Image upload failed'); });
        }
    });
</script>
</th:block>
</body>
</html>
