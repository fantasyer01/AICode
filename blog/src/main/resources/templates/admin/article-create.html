<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/layout}">
<head>
    <title>Create Article</title>
</head>
<body>
<div layout:fragment="content">

    <div class="max-w-3xl mx-auto">
        <h1 class="text-2xl font-bold text-gray-900 mb-6">Create Article</h1>

        <!-- Error Message -->
        <div th:if="${error}" class="mb-4 p-3 rounded-lg bg-red-50 border border-red-200">
            <p class="text-sm text-red-600" th:text="${error}">Error</p>
        </div>

        <form th:action="@{/admin/articles/create}" method="post" class="bg-white rounded-xl border border-gray-200 p-6 space-y-5">

            <div>
                <label for="title" class="block text-sm font-medium text-gray-700 mb-1">Title <span class="text-red-500">*</span></label>
                <input type="text" id="title" name="title" required maxlength="500"
                       th:value="${article?.title}"
                       class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent">
            </div>

            <div>
                <label for="author" class="block text-sm font-medium text-gray-700 mb-1">Author</label>
                <input type="text" id="author" name="author" maxlength="200"
                       th:value="${article?.author}"
                       class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent">
            </div>

            <div>
                <label for="summary" class="block text-sm font-medium text-gray-700 mb-1">Summary</label>
                <textarea id="summary" name="summary" rows="2" maxlength="1000"
                          th:text="${article?.summary}"
                          class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent"></textarea>
            </div>

            <div>
                <label for="tags" class="block text-sm font-medium text-gray-700 mb-1">Tags <span class="text-gray-400 font-normal">(comma-separated)</span></label>
                <input type="text" id="tags" name="tags"
                       th:value="${tagsString}"
                       placeholder="e.g. spring,java,tutorial"
                       class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent">
            </div>

            <div>
                <label for="coverImage" class="block text-sm font-medium text-gray-700 mb-1">Cover Image URL</label>
                <input type="text" id="coverImage" name="coverImage"
                       th:value="${article?.coverImage}"
                       placeholder="https://example.com/image.png"
                       class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent">
            </div>

            <div>
                <label for="content" class="block text-sm font-medium text-gray-700 mb-1">Content (Markdown) <span class="text-red-500">*</span></label>
                <textarea id="content" name="content" rows="16" required
                          th:text="${article?.content}"
                          class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm font-mono focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent"></textarea>
            </div>

            <div class="flex items-center gap-3 pt-2">
                <button type="submit"
                        class="px-5 py-2.5 bg-primary text-white text-sm font-medium rounded-lg hover:bg-primary-dark transition-colors">
                    Save
                </button>
                <a th:href="@{/admin}"
                   class="px-5 py-2.5 text-sm text-gray-600 hover:text-gray-900 transition-colors">
                    Cancel
                </a>
            </div>
        </form>
    </div>

</div>
</body>
</html>
