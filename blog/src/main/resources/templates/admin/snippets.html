<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/layout}">
<head>
    <title>Snippets</title>
</head>
<body>
<div layout:fragment="content">

    <!-- Success Message -->
    <div th:if="${success}" class="mb-4 p-3 rounded-lg bg-green-50 border border-green-200">
        <p class="text-sm text-green-600" th:text="${success}">Success</p>
    </div>

    <!-- Header -->
    <div class="flex justify-between items-center mb-6">
        <h1 class="text-2xl font-bold text-gray-900">Snippets</h1>
        <a th:href="@{/admin/snippets/create}"
           class="px-4 py-2 bg-primary text-white text-sm font-medium rounded-lg hover:bg-primary-dark transition-colors">
            New Snippet
        </a>
    </div>

    <!-- Empty State -->
    <div th:if="${snippets.isEmpty()}" class="text-center py-16 bg-white rounded-xl border border-gray-200">
        <p class="text-gray-500">No snippets yet. Create your first snippet.</p>
    </div>

    <!-- Snippet Table -->
    <div th:unless="${snippets.isEmpty()}" class="bg-white rounded-xl border border-gray-200 overflow-hidden">
        <table class="w-full text-sm">
            <thead class="bg-gray-50 border-b border-gray-200">
                <tr>
                    <th class="text-left px-4 py-3 font-medium text-gray-500">ID</th>
                    <th class="text-left px-4 py-3 font-medium text-gray-500">Title</th>
                    <th class="text-left px-4 py-3 font-medium text-gray-500">Author</th>
                    <th class="text-left px-4 py-3 font-medium text-gray-500">Tags</th>
                    <th class="text-left px-4 py-3 font-medium text-gray-500">Status</th>
                    <th class="text-left px-4 py-3 font-medium text-gray-500">Created</th>
                    <th class="text-right px-4 py-3 font-medium text-gray-500">Actions</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-gray-100">
                <tr th:each="snippet : ${snippets.content}" class="hover:bg-gray-50">
                    <td class="px-4 py-3 text-gray-500" th:text="${snippet.id}">1</td>
                    <td class="px-4 py-3">
                        <a th:if="${snippet.displayTitle != null}" th:href="@{'/snippets/' + ${snippet.id}}"
                           class="text-gray-900 font-medium hover:text-primary transition-colors" th:text="${snippet.displayTitle}">Title</a>
                        <span th:if="${snippet.displayTitle == null}" class="text-gray-400 italic">
                            <span th:if="${snippet.status.name() == 'PENDING'}">Pending...</span>
                            <span th:if="${snippet.status.name() == 'FAILED'}">Failed</span>
                        </span>
                    </td>
                    <td class="px-4 py-3 text-gray-500" th:text="${snippet.author ?: '-'}">Author</td>
                    <td class="px-4 py-3">
                        <div class="flex flex-wrap gap-1">
                            <span th:each="tag : ${snippet.tags}" th:text="${tag}"
                                  class="inline-block px-2 py-0.5 text-xs rounded-full bg-blue-50 text-blue-700">
                            </span>
                        </div>
                    </td>
                    <td class="px-4 py-3">
                        <span th:if="${snippet.status.name() == 'PROCESSED'}"
                              class="inline-block px-2 py-0.5 text-xs rounded-full bg-green-50 text-green-700">Processed</span>
                        <span th:if="${snippet.status.name() == 'PENDING'}"
                              class="inline-block px-2 py-0.5 text-xs rounded-full bg-yellow-50 text-yellow-700">Pending</span>
                        <span th:if="${snippet.status.name() == 'FAILED'}"
                              class="inline-block px-2 py-0.5 text-xs rounded-full bg-red-50 text-red-700">Failed</span>
                    </td>
                    <td class="px-4 py-3 text-gray-500" th:text="${#temporals.format(snippet.createdAt, 'yyyy-MM-dd HH:mm')}">2024-01-01</td>
                    <td class="px-4 py-3 text-right space-x-3">
                        <a th:href="@{'/admin/snippets/' + ${snippet.id} + '/edit'}"
                           class="text-primary hover:text-primary-dark transition-colors">Edit</a>
                        <a th:href="@{'/admin/snippets/' + ${snippet.id} + '/delete'}"
                           class="text-red-500 hover:text-red-700 transition-colors">Delete</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- Pagination -->
    <nav th:if="${snippets.totalPages > 1}" class="mt-6 flex justify-center items-center gap-2">
        <a th:href="@{/admin/snippets(page=${snippets.number - 1})}"
           th:classappend="${snippets.first} ? 'pointer-events-none opacity-40'"
           class="px-4 py-2 text-sm rounded-lg border border-gray-200 bg-white text-gray-600 hover:bg-gray-50 transition-colors">
            Prev
        </a>
        <span class="px-4 py-2 text-sm text-gray-500">
            Page <span th:text="${snippets.number + 1}">1</span> / <span th:text="${snippets.totalPages}">1</span>
        </span>
        <a th:href="@{/admin/snippets(page=${snippets.number + 1})}"
           th:classappend="${snippets.last} ? 'pointer-events-none opacity-40'"
           class="px-4 py-2 text-sm rounded-lg border border-gray-200 bg-white text-gray-600 hover:bg-gray-50 transition-colors">
            Next
        </a>
    </nav>

</div>
</body>
</html>
