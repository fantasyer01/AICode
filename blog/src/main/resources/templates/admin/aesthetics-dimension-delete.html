<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/layout}">
<head>
    <title>Delete Dimension</title>
</head>
<body>
<div layout:fragment="content">

    <div class="max-w-3xl mx-auto">
        <h1 class="text-2xl font-bold text-gray-900 mb-6">Delete Dimension</h1>

        <div class="bg-white rounded-xl border border-gray-200 p-6">
            <div class="bg-red-50 border border-red-200 rounded-lg p-4 mb-6">
                <p class="text-sm text-red-600">
                    Are you sure you want to delete dimension <strong th:text="${dimension.name}">Name</strong>
                    (Type: <span th:text="${dimension.type}">TYPE</span>, ID: <span th:text="${dimension.id}">1</span>)?
                    This action cannot be undone.
                </p>
            </div>

            <form th:action="@{'/admin/aesthetics/dimensions/' + ${dimension.id} + '/delete'}" method="post">
                <div class="flex items-center gap-3">
                    <button type="submit"
                            class="px-5 py-2.5 bg-red-600 text-white text-sm font-medium rounded-lg hover:bg-red-700 transition-colors">
                        Confirm Delete
                    </button>
                    <a th:href="@{/admin/aesthetics/dimensions}"
                       class="px-5 py-2.5 text-sm text-gray-600 hover:text-gray-900 transition-colors">
                        Cancel
                    </a>
                </div>
            </form>
        </div>
    </div>

</div>
</body>
</html>
