<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title layout:title-pattern="$CONTENT_TITLE - Admin">AI Blog Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#2563eb',
                        'primary-dark': '#1d4ed8',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-100 text-gray-900 min-h-screen flex flex-col">

    <!-- Admin Navigation -->
    <nav class="bg-gray-800 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 sm:px-6">
            <div class="flex justify-between items-center h-14">
                <div class="flex items-center space-x-6">
                    <a th:href="@{/admin}" class="text-lg font-bold text-white hover:text-blue-300 transition-colors">
                        AI Blog Admin
                    </a>
                    <a th:href="@{/admin}" class="text-sm text-gray-300 hover:text-white transition-colors">Articles</a>
                    <a th:href="@{/admin/snippets}" class="text-sm text-gray-300 hover:text-white transition-colors">Snippets</a>
                    <a th:href="@{/admin/audit-logs}" class="text-sm text-gray-300 hover:text-white transition-colors">Audit Logs</a>
                </div>
                <div class="flex items-center space-x-4 text-sm">
                    <a th:href="@{/}" class="text-gray-300 hover:text-white transition-colors">View Blog</a>
                    <a th:href="@{/snippets}" class="text-gray-300 hover:text-white transition-colors">View Snippets</a>
                    <a th:href="@{/admin/logout}" class="text-red-400 hover:text-red-300 transition-colors">Logout</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow max-w-6xl mx-auto w-full px-4 sm:px-6 py-8">
        <!-- Toast Notification -->
        <div th:if="${success}" id="toast-success"
             class="fixed top-6 left-1/2 -translate-x-1/2 z-[100] flex items-center gap-3 px-5 py-3 rounded-lg bg-green-50 border border-green-200 shadow-lg transition-all duration-300">
            <svg class="w-5 h-5 text-green-500 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
            </svg>
            <span class="text-sm text-green-700" th:text="${success}">Success</span>
            <button onclick="document.getElementById('toast-success').remove()" class="ml-2 text-green-400 hover:text-green-600">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                </svg>
            </button>
        </div>
        <script th:if="${success}">
            setTimeout(function() {
                var toast = document.getElementById('toast-success');
                if (toast) {
                    toast.style.opacity = '0';
                    toast.style.transform = 'translate(-50%, -10px)';
                    setTimeout(function() { toast.remove(); }, 300);
                }
            }, 4000);
        </script>

        <div layout:fragment="content"></div>
    </main>

    <!-- Footer -->
    <footer class="bg-gray-800 mt-auto">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 py-4">
            <p class="text-center text-xs text-gray-500">
                AI Blog Admin Panel
            </p>
        </div>
    </footer>

</body>
</html>
