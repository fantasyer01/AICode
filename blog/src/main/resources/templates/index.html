<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Home</title>
</head>
<body>
<div layout:fragment="content">

    <!-- Category Filter Bar -->
    <div class="mb-8" th:if="${not #lists.isEmpty(allCategories)}">
        <div class="flex flex-wrap items-center gap-2">
            <span class="text-sm font-medium text-warm-gray mr-1">Categories:</span>
            <a th:each="c : ${allCategories}"
               th:href="@{'/category/' + ${c}}"
               th:text="${c}"
               class="inline-block px-3 py-1 text-xs font-medium rounded-full bg-white text-secondary hover:bg-secondary hover:text-white transition-colors border border-warm-border">
            </a>
        </div>
    </div>

    <!-- Empty State -->
    <div th:if="${articles.isEmpty()}" class="text-center py-20">
        <div class="text-5xl mb-4 text-warm-border">&#9997;</div>
        <h2 class="text-xl font-semibold text-warm-gray mb-2 font-serif">No articles yet</h2>
        <p class="text-warm-gray/70">Publish your first article via the API.</p>
    </div>

    <!-- Article Grid -->
    <div th:unless="${articles.isEmpty()}" class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <article th:each="article : ${articles.content}"
                 class="bg-white rounded-xl shadow-sm border border-warm-border overflow-hidden hover:shadow-md transition-all duration-300 hover:-translate-y-1">

            <!-- Cover Image -->
            <a th:href="@{'/articles/' + ${article.id}}">
                <div th:if="${article.coverImageUrl != null and !article.coverImageUrl.isEmpty()}"
                     class="cover-image-wrapper bg-gray-100 overflow-hidden">
                    <img th:src="${article.coverImageUrl}" th:alt="${article.title}"
                         loading="lazy" decoding="async"
                         class="cover-image w-full h-auto object-contain">
                </div>
                <div th:unless="${article.coverImageUrl != null and !article.coverImageUrl.isEmpty()}"
                     class="h-32 bg-gradient-to-br from-cream to-accent/30">
                </div>
            </a>

            <div class="p-5">
                <!-- Title -->
                <a th:href="@{'/articles/' + ${article.id}}">
                    <h2 class="text-lg font-semibold text-gray-800 hover:text-primary transition-colors line-clamp-2 mb-2 font-serif"
                        th:text="${article.title}">Article Title</h2>
                </a>

                <!-- Summary -->
                <p th:if="${article.summary != null and !article.summary.isEmpty()}"
                   th:text="${article.summary}"
                   class="text-sm text-warm-gray line-clamp-3 mb-3">
                </p>

                <!-- Meta -->
                <div class="flex items-center justify-between text-xs text-warm-gray/70">
                    <div class="flex items-center gap-3">
                        <span th:if="${article.author != null and !article.author.isEmpty()}"
                              th:text="${article.author}" class="font-medium text-warm-gray"></span>
                        <time th:text="${#temporals.format(article.createdAt, 'yyyy-MM-dd')}"></time>
                    </div>
                </div>

                <!-- Tags -->
                <div th:if="${article.tags != null and !article.tags.isEmpty()}" class="mt-3 flex flex-wrap gap-1">
                    <a th:each="tag : ${article.tags}"
                       th:href="@{'/tag/' + ${tag}}"
                       th:text="'#' + ${tag}"
                       class="text-xs px-2 py-0.5 rounded-full bg-cream text-warm-gray hover:bg-secondary hover:text-white transition-colors">
                    </a>
                </div>
            </div>
        </article>
    </div>

    <!-- Pagination -->
    <nav th:if="${articles.totalPages > 1}" class="mt-10 flex justify-center items-center gap-2">
        <a th:href="@{${paginationBaseUrl} + '?page=0'}"
           th:classappend="${articles.first} ? 'pointer-events-none opacity-40'"
           class="px-3 py-2 text-sm rounded-lg border border-warm-border bg-white text-warm-gray hover:bg-cream transition-colors">
            首页
        </a>

        <a th:href="@{${paginationBaseUrl} + '?page=' + ${articles.number - 1}}"
           th:classappend="${articles.first} ? 'pointer-events-none opacity-40'"
           class="px-3 py-2 text-sm rounded-lg border border-warm-border bg-white text-warm-gray hover:bg-cream transition-colors">
            Prev
        </a>

        <span class="px-4 py-2 text-sm text-warm-gray">
            Page <span th:text="${articles.number + 1}">1</span> / <span th:text="${articles.totalPages}">1</span>
        </span>

        <a th:href="@{${paginationBaseUrl} + '?page=' + ${articles.number + 1}}"
           th:classappend="${articles.last} ? 'pointer-events-none opacity-40'"
           class="px-3 py-2 text-sm rounded-lg border border-warm-border bg-white text-warm-gray hover:bg-cream transition-colors">
            Next
        </a>

        <a th:href="@{${paginationBaseUrl} + '?page=' + ${articles.totalPages - 1}}"
           th:classappend="${articles.last} ? 'pointer-events-none opacity-40'"
           class="px-3 py-2 text-sm rounded-lg border border-warm-border bg-white text-warm-gray hover:bg-cream transition-colors">
            尾页
        </a>
    </nav>

</div>
</body>
</html>
