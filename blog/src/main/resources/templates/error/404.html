<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Page Not Found</title>
</head>
<body>
<div layout:fragment="content">
    <div class="text-center py-20">
        <h1 class="text-6xl font-bold text-gray-300 mb-4">404</h1>
        <h2 class="text-xl font-semibold text-gray-500 mb-2">Page Not Found</h2>
        <p class="text-gray-400 mb-6">The page you are looking for does not exist.</p>
        <a th:href="@{/}" class="text-primary hover:underline">&larr; Go back home</a>
    </div>
</div>
</body>
</html>
