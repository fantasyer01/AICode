<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title th:text="'Tag: #' + ${tagName}">Tag</title>
</head>
<body>
<div layout:fragment="content">

    <!-- Header -->
    <div class="mb-8">
        <h1 class="text-2xl font-bold text-gray-900">
            Articles tagged: <span class="text-primary" th:text="'#' + ${tagName}">#tag</span>
        </h1>
        <a th:href="@{/}" class="text-sm text-gray-500 hover:text-primary transition-colors mt-2 inline-block">
            &larr; All articles
        </a>
    </div>

    <!-- Tag Filter Bar -->
    <div class="mb-8" th:if="${not #lists.isEmpty(allTags)}">
        <div class="flex flex-wrap items-center gap-2">
            <span class="text-sm font-medium text-gray-500 mr-1">Tags:</span>
            <a th:each="t : ${allTags}"
               th:href="@{'/tag/' + ${t}}"
               th:text="'#' + ${t}"
               th:classappend="${t == tagName} ? 'bg-blue-600 text-white' : 'bg-blue-50 text-blue-700 hover:bg-blue-100'"
               class="inline-block px-3 py-1 text-xs font-medium rounded-full transition-colors">
            </a>
        </div>
    </div>

    <!-- Empty State -->
    <div th:if="${articles.isEmpty()}" class="text-center py-20">
        <h2 class="text-xl font-semibold text-gray-500 mb-2">No articles with this tag</h2>
    </div>

    <!-- Article Grid -->
    <div th:unless="${articles.isEmpty()}" class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <article th:each="article : ${articles.content}"
                 class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden hover:shadow-md transition-shadow">

            <a th:href="@{'/articles/' + ${article.id}}">
                <div th:if="${article.coverImageUrl != null and !article.coverImageUrl.isEmpty()}"
                     class="cover-image-wrapper h-48 bg-gray-100 overflow-hidden">
                    <img th:src="${article.coverImageUrl}" th:alt="${article.title}"
                         loading="lazy" decoding="async"
                         class="cover-image w-full h-full object-cover">
                </div>
                <div th:unless="${article.coverImageUrl != null and !article.coverImageUrl.isEmpty()}"
                     class="h-32 bg-gradient-to-br from-blue-50 to-indigo-100">
                </div>
            </a>

            <div class="p-5">
                <a th:href="@{'/articles/' + ${article.id}}">
                    <h2 class="text-lg font-semibold text-gray-900 hover:text-primary transition-colors line-clamp-2 mb-2"
                        th:text="${article.title}">Article Title</h2>
                </a>
                <p th:if="${article.summary != null and !article.summary.isEmpty()}"
                   th:text="${article.summary}"
                   class="text-sm text-gray-600 line-clamp-3 mb-3">
                </p>
                <div class="flex items-center justify-between text-xs text-gray-400">
                    <div class="flex items-center gap-3">
                        <span th:if="${article.author != null and !article.author.isEmpty()}"
                              th:text="${article.author}" class="font-medium text-gray-500"></span>
                        <time th:text="${#temporals.format(article.createdAt, 'yyyy-MM-dd')}"></time>
                    </div>
                </div>
                <div th:if="${article.tags != null and !article.tags.isEmpty()}" class="mt-3 flex flex-wrap gap-1">
                    <a th:each="tag : ${article.tags}"
                       th:href="@{'/tag/' + ${tag}}"
                       th:text="'#' + ${tag}"
                       class="text-xs px-2 py-0.5 rounded-full bg-gray-100 text-gray-500 hover:bg-blue-50 hover:text-blue-600 transition-colors">
                    </a>
                </div>
            </div>
        </article>
    </div>

    <!-- Pagination -->
    <nav th:if="${articles.totalPages > 1}" class="mt-10 flex justify-center items-center gap-2">
        <a th:href="@{'/tag/' + ${tagName} + '?page=' + ${articles.number - 1}}"
           th:classappend="${articles.first} ? 'pointer-events-none opacity-40'"
           class="px-4 py-2 text-sm rounded-lg border border-gray-200 bg-white text-gray-600 hover:bg-gray-50 transition-colors">
            Prev
        </a>
        <span class="px-4 py-2 text-sm text-gray-500">
            Page <span th:text="${articles.number + 1}">1</span> / <span th:text="${articles.totalPages}">1</span>
        </span>
        <a th:href="@{'/tag/' + ${tagName} + '?page=' + ${articles.number + 1}}"
           th:classappend="${articles.last} ? 'pointer-events-none opacity-40'"
           class="px-4 py-2 text-sm rounded-lg border border-gray-200 bg-white text-gray-600 hover:bg-gray-50 transition-colors">
            Next
        </a>
    </nav>

</div>
</body>
</html>
