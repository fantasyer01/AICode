server:
  port: 8081

spring:
  application:
    name: network-simulator
  
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/simulator_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: simulator
    password: simulator123
    
    druid:
      # Pool sizing
      initial-size: 5
      min-idle: 5
      max-active: 20
      
      # Connection wait timeout (ms)
      max-wait: 60000
      
      # Connection validation - CRITICAL for recovery testing
      test-on-borrow: true
      test-while-idle: true
      test-on-return: false
      validation-query: SELECT 1
      validation-query-timeout: 5
      
      # Eviction settings
      time-between-eviction-runs-millis: 30000
      min-evictable-idle-time-millis: 300000
      
      # Connection recovery settings - KEY for fault recovery
      break-after-acquire-failure: false
      connection-error-retry-attempts: 3
      fail-fast: true
      
      # Keep alive
      keep-alive: true
      keep-alive-between-time-millis: 30000
      
      # Remove abandoned connections
      remove-abandoned: true
      remove-abandoned-timeout: 300
      log-abandoned: true
      
      # Filters for monitoring
      filters: stat,wall
      
      # Stat view servlet (monitoring page)
      stat-view-servlet:
        enabled: true
        url-pattern: /druid/*
        login-username: admin
        login-password: admin123
        reset-enable: false
        allow: ""
      
      # Web stat filter
      web-stat-filter:
        enabled: true
        url-pattern: /*
        exclusions: "*.js,*.gif,*.jpg,*.png,*.css,*.ico,/druid/*"

# Docker configuration
docker:
  host: tcp://localhost:2375
  container-name: simulator-mysql
  network-name: simulator-network

# Logging
logging:
  level:
    com.simulator: DEBUG
    com.alibaba.druid: DEBUG
