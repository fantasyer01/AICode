version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: simulator-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: simulator_db
      MYSQL_USER: simulator
      MYSQL_PASSWORD: simulator123
    ports:
      - "3306:3306"
    volumes:
      - ./init-db:/docker-entrypoint-initdb.d
      - mysql_data:/var/lib/mysql
    networks:
      - simulator-network
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  simulator-network:
    name: simulator-network
    driver: bridge

volumes:
  mysql_data:
