# Spring Boot Configuration
spring.application.name=it-history-backend

# Server Configuration
server.port=8080

# Database Configuration (H2 for development)
spring.datasource.url=jdbc:h2:mem:ithistory
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (for development)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# LLM Provider Configuration (OpenAI)
llm.openai.api-key=${OPENAI_API_KEY:}
llm.openai.model=gpt-3.5-turbo
llm.openai.endpoint=https://api.openai.com/v1/chat/completions
llm.openai.max-tokens=2000
llm.openai.temperature=0.7

# LLM Provider Configuration (DeepSeek)
llm.deepseek.api-key=sk-007cd17745724ca0857e1e79b9e2d32b
llm.deepseek.model=deepseek-chat
llm.deepseek.endpoint=https://api.deepseek.com/chat/completions
llm.deepseek.max-tokens=8000
llm.deepseek.temperature=0.7

# Active LLM provider (e.g. openai, deepseek, google, glm)
llm.provider=deepseek

# Logging Configuration
logging.level.com.ithistory=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG

# API Documentation
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
