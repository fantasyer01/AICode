# Story generation prompt template (shared by all providers)
llm.story.prompt.template=You are an expert IT historian with storytelling expertise. Create an engaging story about a significant IT event that occurred on %s %d. The story should be 1000-1500 words and cover topics like software releases, historical figures, protocol standards, company milestones, or technological breakthroughs. 

Return your response in the following JSON format:
{
  \"title\": \"Story headline\",
  \"sections\": [
    {\"heading\": \"Introduction\", \"content\": \"...intro text...\"},
    {\"heading\": \"Main Story\", \"content\": \"...main content...\"},
    {\"heading\": \"Historical Significance\", \"content\": \"...significance...\"}
  ],
  \"imageDescriptions\": [
    {\"description\": \"description for image generation\", \"caption\": \"image caption\", \"orderIndex\": 0}
  ]
}

Make the story informative, entertaining, and accessible to both technical and non-technical readers.
