# Application Configuration
server:
  port: 8080
  servlet:
    context-path: /

# Spring Application Configuration
spring:
  application:
    name: ai-alibaba-dify
  profiles:
    active: dev
  http:
    connect-timeout: 5000
    read-timeout: 60000
    write-timeout: 30000
    max-retry-attempts: 3
    sse-idle-timeout: 60000
    connection-pool-size: 5
    connection-pool-keep-alive: 5
    retry-on-connection-failure: true
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:}
      chat:
        options:
          model: qwen-plus
    deepseek:
      api-key: ${DEEPSEEK_API_KEY:}
      chat:
        options:
          model: deepseek-chat
    
# Dify Configuration
dify:
  api:
    base-url: https://api.dify.ai/v1
    temperature: 0.7
    max-tokens: 1000
    response-mode: streaming  # Options: "blocking" or "streaming"
  apps:
    default:
      api-key: ${DIFY_DEFAULT_API_KEY:}
      app-id: ${DIFY_DEFAULT_APP_ID:}
    customer-service:
      api-key: ${DIFY_CS_API_KEY:}
      app-id: ${DIFY_CS_APP_ID:}
    tech-support:
      api-key: ${DIFY_TS_API_KEY:}
      app-id: ${DIFY_TS_APP_ID:}

# AI Models Configuration
ai-models:
  api:
    temperature: 0.7
    max-tokens: 1000
  available:
    - name: "Qwen-Plus"
      code: "qwen-plus"
      provider: "dashscope"
      description: "通义千问增强版"
    - name: "DeepSeek"
      code: "deepseek-chat"
      provider: "deepseek"
      description: "DeepSeek深度求索模型"
  
# Enterprise WeChat (WeCom) Configuration
wecom:
  bot:
    token: ${WECOM_BOT_TOKEN:}
    encoding-aes-key: ${WECOM_BOT_AES_KEY:}
    corp-id: ${WECOM_CORP_ID:}

# Logging Configuration
logging:
  level:
    com.example.aialibaba: DEBUG
    org.springframework.web: INFO
    org.apache.http: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} [%X{requestId}] - %msg%n"

# Management Endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# SpringDoc OpenAPI Configuration
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  packages-to-scan: com.example.aialibaba.controller