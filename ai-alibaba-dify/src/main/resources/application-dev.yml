# Development Environment Configuration
# Override default values for development

# Server Configuration
server:
  port: 8080

# Spring AI Alibaba Configuration
spring:
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:}  # Replace with your actual DashScope API key
      chat:
        options:
          model: qwen-plus
    deepseek:
      api-key: ${DEEPSEEK_API_KEY:}  # Replace with your actual DeepSeek API key
      chat:
        options:
          model: deepseek-chat

# Dify Configuration for Development
# Note: In production, these should be set via environment variables
dify:
  api:
    base-url: https://api.dify.ai/v1
  apps:
    default:
      api-key: ${DIFY_DEFAULT_API_KEY:}  # Replace with your actual Dify API key
      app-id: ${DIFY_DEFAULT_APP_ID:}  # Your Dify App ID from the URL
    customer-service:
      api-key: app-6WeBDQ4k7keBbmHDXAb06nlf
      app-id: d31dca5e-c5a6-4fa3-8710-4a9bed27c2ea
    tech-support:
      api-key: ${DIFY_TS_API_KEY:}
      app-id: ${DIFY_TS_APP_ID:}
  timeout:
    connect: 5000
    read: 120000
  retry:
    max-attempts: 3

# Logging Configuration for Development
logging:
  level:
    com.example.aialibaba: DEBUG
    org.springframework.web: DEBUG
    org.apache.http.wire: DEBUG
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

