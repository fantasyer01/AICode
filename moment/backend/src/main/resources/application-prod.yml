# Production Profile Configuration

spring:
  # Database configuration from environment variables
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/portfolio}
    username: ${DB_USERNAME:portfolio}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000
  
  # JPA/Hibernate configuration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false
  
  # Disable SQL initialization in production
  sql:
    init:
      mode: never

# CORS configuration from environment variable
app:
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:https://localhost}
    max-age: 3600

# Server configuration
server:
  port: ${SERVER_PORT:8080}

# Actuator endpoints - restrict access in production
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

# Disable Swagger in production
springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

# Logging configuration for production
logging:
  level:
    root: WARN
    com.portfolio.showcase: INFO
    com.portfolio.showcase.controller: INFO
    com.portfolio.showcase.service: INFO
    org.springframework.web: WARN
    org.springframework.security: WARN
    org.hibernate: WARN
