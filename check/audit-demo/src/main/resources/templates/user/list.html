<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户管理 - 审核管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="/">
                <i class="bi bi-shield-check me-2"></i>审核管理系统
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/audit/pending">
                            <i class="bi bi-hourglass-split me-1"></i>待审核
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/audit">
                            <i class="bi bi-list-check me-1"></i>审核记录
                        </a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle active" href="#" data-bs-toggle="dropdown">
                            <i class="bi bi-database me-1"></i>业务管理
                        </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item active" href="/user">
                                <i class="bi bi-people me-2"></i>用户管理 (单表)
                            </a></li>
                            <li><a class="dropdown-item" href="/order">
                                <i class="bi bi-cart3 me-2"></i>订单管理 (多表)
                            </a></li>
                        </ul>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/permission">
                            <i class="bi bi-key me-1"></i>字段权限
                        </a>
                    </li>
                </ul>
                <span class="navbar-text text-light">
                    <i class="bi bi-person-circle me-1"></i>Demo User
                </span>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container-fluid py-4">
        <!-- Page Header -->
        <div class="page-header d-flex justify-content-between align-items-center">
            <div>
                <h4><i class="bi bi-people me-2 text-primary"></i>用户管理 <small class="text-muted fs-6">(单表演示)</small></h4>
                <p class="text-muted mb-0">演示单表数据的增删改操作，所有操作都需要审核通过后才会生效</p>
            </div>
            <div>
                <button class="btn btn-primary" onclick="showAddModal()">
                    <i class="bi bi-plus-lg me-1"></i>新增用户
                </button>
            </div>
        </div>

        <!-- Search -->
        <div class="card mb-4">
            <div class="card-body py-2">
                <form class="row g-2 align-items-center" method="get">
                    <div class="col-auto">
                        <input type="text" class="form-control form-control-sm" name="keyword" 
                               placeholder="搜索用户名/姓名/邮箱..." th:value="${keyword}" style="width: 250px;">
                    </div>
                    <div class="col-auto">
                        <button type="submit" class="btn btn-sm btn-primary">
                            <i class="bi bi-search me-1"></i>搜索
                        </button>
                        <a href="/user" class="btn btn-sm btn-outline-secondary">
                            <i class="bi bi-x-lg me-1"></i>清除
                        </a>
                    </div>
                </form>
            </div>
        </div>

        <!-- Data Table -->
        <div class="card">
            <div class="card-header">
                <i class="bi bi-table me-2"></i>用户列表
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover mb-0">
                        <thead>
                            <tr>
                                <th width="80" data-field="id">ID</th>
                                <th data-field="username">用户名</th>
                                <th data-field="realName">姓名</th>
                                <th data-field="email">邮箱</th>
                                <th data-field="phone">电话</th>
                                <th data-field="department">部门</th>
                                <th width="100" data-field="status">状态</th>
                                <th width="160" data-field="createTime">创建时间</th>
                                <th width="150">操作</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="user : ${pageResult.records}">
                                <td data-field="id" th:text="${user.id}"></td>
                                <td data-field="username" th:text="${user.username}"></td>
                                <td data-field="realName" th:text="${user.realName}"></td>
                                <td data-field="email" th:text="${user.email}"></td>
                                <td data-field="phone" th:text="${user.phone}"></td>
                                <td data-field="department" th:text="${user.department}"></td>
                                <td data-field="status">
                                    <span class="badge bg-success" th:if="${user.status == 1}">启用</span>
                                    <span class="badge bg-secondary" th:if="${user.status == 0}">禁用</span>
                                </td>
                                <td data-field="createTime" th:text="${user.createTime != null ? #temporals.format(user.createTime, 'yyyy-MM-dd HH:mm') : '-'}"></td>
                                <td>
                                    <button class="btn btn-sm btn-outline-primary btn-action me-1" 
                                            th:data-id="${user.id}" onclick="showEditModal(this)">
                                        <i class="bi bi-pencil"></i> 编辑
                                    </button>
                                    <button class="btn btn-sm btn-outline-danger btn-action" 
                                            th:data-id="${user.id}" th:data-name="${user.username}" onclick="deleteUser(this)">
                                        <i class="bi bi-trash"></i> 删除
                                    </button>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(pageResult.records)}">
                                <td colspan="9">
                                    <div class="empty-state">
                                        <div class="icon"><i class="bi bi-people"></i></div>
                                        <p>暂无用户数据</p>
                                        <button class="btn btn-primary btn-sm" onclick="showAddModal()">
                                            <i class="bi bi-plus-lg me-1"></i>新增用户
                                        </button>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
            <!-- Pagination -->
            <div class="card-footer bg-white" th:if="${pageResult.pages > 1}">
                <nav>
                    <ul class="pagination justify-content-center mb-0">
                        <li class="page-item" th:classappend="${pageResult.current == 1} ? 'disabled'">
                            <a class="page-link" th:href="@{/user(page=${pageResult.current - 1}, keyword=${keyword})}">
                                <i class="bi bi-chevron-left"></i>
                            </a>
                        </li>
                        <li class="page-item" th:each="i : ${#numbers.sequence(1, pageResult.pages)}" 
                            th:classappend="${i == pageResult.current} ? 'active'">
                            <a class="page-link" th:href="@{/user(page=${i}, keyword=${keyword})}" th:text="${i}"></a>
                        </li>
                        <li class="page-item" th:classappend="${pageResult.current == pageResult.pages} ? 'disabled'">
                            <a class="page-link" th:href="@{/user(page=${pageResult.current + 1}, keyword=${keyword})}">
                                <i class="bi bi-chevron-right"></i>
                            </a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </div>

    <!-- Add/Edit Modal -->
    <div class="modal fade" id="userModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="bi bi-person-plus me-2"></i><span id="modalTitle">新增用户</span></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="userForm">
                        <input type="hidden" id="userId">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">用户名 <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="username" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">姓名 <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="realName" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">邮箱</label>
                                <input type="email" class="form-control" id="email">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">电话</label>
                                <input type="text" class="form-control" id="phone">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">部门</label>
                                <input type="text" class="form-control" id="department">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">状态</label>
                                <select class="form-select" id="status">
                                    <option value="1">启用</option>
                                    <option value="0">禁用</option>
                                </select>
                            </div>
                        </div>
                    </form>
                    <div class="alert alert-info mb-0">
                        <i class="bi bi-info-circle me-2"></i>
                        <strong>提示:</strong> 提交后数据不会立即生效，需要审核通过后才会写入数据库。
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" onclick="saveUser()">
                        <i class="bi bi-send me-1"></i>提交审核
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer mt-auto py-3 bg-light border-top">
        <div class="container text-center text-muted">
            <small>审核管理系统 Demo - 基于注解的通用复核功能演示</small>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/common.js"></script>
    <script>
        let userModal;
        let isEdit = false;
        
        document.addEventListener('DOMContentLoaded', function() {
            userModal = new bootstrap.Modal(document.getElementById('userModal'));
            // Apply field permissions to hide columns
            applyFieldPermissions('biz_user');
        });
        
        // Hide columns based on field permissions
        async function applyFieldPermissions(tableName) {
            try {
                const result = await apiRequest(`/permission/api/queryable/${tableName}`);
                if (!result.success) {
                    console.warn('Failed to fetch field permissions');
                    return;
                }
                
                const queryableFields = result.data;
                const allFields = ['id', 'username', 'realName', 'email', 'phone', 'department', 'status', 'createTime', 'updateTime'];
                
                // Hide columns for fields that are not queryable
                allFields.forEach(field => {
                    if (!queryableFields.includes(field)) {
                        // Hide header
                        document.querySelectorAll(`th[data-field="${field}"]`).forEach(el => {
                            el.style.display = 'none';
                        });
                        // Hide cells
                        document.querySelectorAll(`td[data-field="${field}"]`).forEach(el => {
                            el.style.display = 'none';
                        });
                    }
                });
            } catch (e) {
                console.warn('Error applying field permissions:', e);
            }
        }
        
        function showAddModal() {
            isEdit = false;
            document.getElementById('modalTitle').textContent = '新增用户';
            document.getElementById('userForm').reset();
            document.getElementById('userId').value = '';
            userModal.show();
        }
        
        async function showEditModal(btn) {
            isEdit = true;
            const id = btn.dataset.id;
            
            const result = await apiRequest(`/user/api/${id}`);
            if (!result.success) {
                showToast('获取用户信息失败', 'error');
                return;
            }
            
            const user = result.data;
            document.getElementById('modalTitle').textContent = '编辑用户';
            document.getElementById('userId').value = user.id;
            document.getElementById('username').value = user.username || '';
            document.getElementById('realName').value = user.realName || '';
            document.getElementById('email').value = user.email || '';
            document.getElementById('phone').value = user.phone || '';
            document.getElementById('department').value = user.department || '';
            document.getElementById('status').value = user.status;
            
            userModal.show();
        }
        
        async function saveUser() {
            const username = document.getElementById('username').value.trim();
            const realName = document.getElementById('realName').value.trim();
            
            if (!username || !realName) {
                showToast('请填写必填项', 'warning');
                return;
            }
            
            const data = {
                username: username,
                realName: realName,
                email: document.getElementById('email').value.trim(),
                phone: document.getElementById('phone').value.trim(),
                department: document.getElementById('department').value.trim(),
                status: parseInt(document.getElementById('status').value)
            };
            
            let result;
            if (isEdit) {
                const id = document.getElementById('userId').value;
                result = await apiRequest(`/user/api/${id}`, 'PUT', data);
            } else {
                result = await apiRequest('/user/api', 'POST', data);
            }
            
            if (result.success) {
                showToast(result.message, 'success');
                userModal.hide();
                setTimeout(() => location.reload(), 1500);
            } else {
                showToast(result.message, 'error');
            }
        }
        
        async function deleteUser(btn) {
            const id = btn.dataset.id;
            const name = btn.dataset.name;
            
            if (!confirm(`确定要删除用户 "${name}" 吗？删除操作需要审核通过后才会执行。`)) {
                return;
            }
            
            const result = await apiRequest(`/user/api/${id}`, 'DELETE');
            
            if (result.success) {
                showToast(result.message, 'success');
                setTimeout(() => location.reload(), 1500);
            } else {
                showToast(result.message, 'error');
            }
        }
    </script>
</body>
</html>
