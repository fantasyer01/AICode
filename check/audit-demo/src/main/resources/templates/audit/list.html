<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>审核记录 - 审核管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="/">
                <i class="bi bi-shield-check me-2"></i>审核管理系统
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/audit/pending">
                            <i class="bi bi-hourglass-split me-1"></i>待审核
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/audit">
                            <i class="bi bi-list-check me-1"></i>审核记录
                        </a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">
                            <i class="bi bi-database me-1"></i>业务管理
                        </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="/user">
                                <i class="bi bi-people me-2"></i>用户管理 (单表)
                            </a></li>
                            <li><a class="dropdown-item" href="/order">
                                <i class="bi bi-cart3 me-2"></i>订单管理 (多表)
                            </a></li>
                        </ul>
                    </li>
                </ul>
                <span class="navbar-text text-light">
                    <i class="bi bi-person-circle me-1"></i>Demo User
                </span>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container-fluid py-4">
        <!-- Page Header -->
        <div class="page-header">
            <h4><i class="bi bi-list-check me-2 text-primary"></i>审核记录</h4>
            <p class="text-muted mb-0">查看所有审核请求的历史记录</p>
        </div>

        <!-- Filter -->
        <div class="card mb-4">
            <div class="card-body py-2">
                <form class="row g-2 align-items-center" method="get">
                    <div class="col-auto">
                        <label class="col-form-label">业务类型:</label>
                    </div>
                    <div class="col-auto">
                        <select class="form-select form-select-sm" name="businessType">
                            <option value="">全部</option>
                            <option value="USER_MGMT" th:selected="${businessType == 'USER_MGMT'}">用户管理</option>
                            <option value="ORDER_MGMT" th:selected="${businessType == 'ORDER_MGMT'}">订单管理</option>
                        </select>
                    </div>
                    <div class="col-auto">
                        <label class="col-form-label">状态:</label>
                    </div>
                    <div class="col-auto">
                        <select class="form-select form-select-sm" name="status">
                            <option value="">全部</option>
                            <option value="0" th:selected="${status == 0}">待审核</option>
                            <option value="1" th:selected="${status == 1}">已通过</option>
                            <option value="2" th:selected="${status == 2}">已驳回</option>
                        </select>
                    </div>
                    <div class="col-auto">
                        <button type="submit" class="btn btn-sm btn-primary">
                            <i class="bi bi-search me-1"></i>查询
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Data Table -->
        <div class="card">
            <div class="card-header">
                <i class="bi bi-table me-2"></i>审核记录列表
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover mb-0">
                        <thead>
                            <tr>
                                <th width="80">ID</th>
                                <th width="120">业务类型</th>
                                <th>业务描述</th>
                                <th width="100">操作类型</th>
                                <th width="100">状态</th>
                                <th width="120">提交人</th>
                                <th width="140">提交时间</th>
                                <th width="120">审核人</th>
                                <th width="140">审核时间</th>
                                <th width="100">操作</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="item : ${pageResult.records}">
                                <td th:text="${item.id}"></td>
                                <td>
                                    <span class="badge bg-secondary" th:text="${item.businessType == 'USER_MGMT' ? '用户管理' : item.businessType == 'ORDER_MGMT' ? '订单管理' : item.businessType}"></span>
                                </td>
                                <td th:text="${item.businessDesc}"></td>
                                <td>
                                    <span class="badge badge-insert" th:if="${item.operationType == 'INSERT'}">新增</span>
                                    <span class="badge badge-update" th:if="${item.operationType == 'UPDATE'}">修改</span>
                                    <span class="badge badge-delete" th:if="${item.operationType == 'DELETE'}">删除</span>
                                </td>
                                <td>
                                    <span class="badge badge-pending" th:if="${item.status == 0}">
                                        <i class="bi bi-hourglass-split me-1"></i>待审核
                                    </span>
                                    <span class="badge badge-approved" th:if="${item.status == 1}">
                                        <i class="bi bi-check-circle me-1"></i>已通过
                                    </span>
                                    <span class="badge badge-rejected" th:if="${item.status == 2}">
                                        <i class="bi bi-x-circle me-1"></i>已驳回
                                    </span>
                                </td>
                                <td th:text="${item.submitUserName}"></td>
                                <td th:text="${#temporals.format(item.submitTime, 'yyyy-MM-dd HH:mm')}"></td>
                                <td th:text="${item.auditUserName ?: '-'}"></td>
                                <td th:text="${item.auditTime != null ? #temporals.format(item.auditTime, 'yyyy-MM-dd HH:mm') : '-'}"></td>
                                <td>
                                    <a th:href="@{/audit/detail/{id}(id=${item.id})}" class="btn btn-sm btn-outline-primary btn-action">
                                        <i class="bi bi-eye"></i> 详情
                                    </a>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(pageResult.records)}">
                                <td colspan="10">
                                    <div class="empty-state">
                                        <div class="icon"><i class="bi bi-inbox"></i></div>
                                        <p>暂无记录</p>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
            <!-- Pagination -->
            <div class="card-footer bg-white" th:if="${pageResult.pages > 1}">
                <nav>
                    <ul class="pagination justify-content-center mb-0">
                        <li class="page-item" th:classappend="${pageResult.current == 1} ? 'disabled'">
                            <a class="page-link" th:href="@{/audit(page=${pageResult.current - 1}, businessType=${businessType}, status=${status})}">
                                <i class="bi bi-chevron-left"></i>
                            </a>
                        </li>
                        <li class="page-item" th:each="i : ${#numbers.sequence(1, pageResult.pages)}" 
                            th:classappend="${i == pageResult.current} ? 'active'">
                            <a class="page-link" th:href="@{/audit(page=${i}, businessType=${businessType}, status=${status})}" th:text="${i}"></a>
                        </li>
                        <li class="page-item" th:classappend="${pageResult.current == pageResult.pages} ? 'disabled'">
                            <a class="page-link" th:href="@{/audit(page=${pageResult.current + 1}, businessType=${businessType}, status=${status})}">
                                <i class="bi bi-chevron-right"></i>
                            </a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer mt-auto py-3 bg-light border-top">
        <div class="container text-center text-muted">
            <small>审核管理系统 Demo - 基于注解的通用复核功能演示</small>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/common.js"></script>
</body>
</html>
