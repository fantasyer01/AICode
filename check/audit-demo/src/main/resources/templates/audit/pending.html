<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>待审核列表 - 审核管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="/">
                <i class="bi bi-shield-check me-2"></i>审核管理系统
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="/audit/pending">
                            <i class="bi bi-hourglass-split me-1"></i>待审核
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/audit">
                            <i class="bi bi-list-check me-1"></i>审核记录
                        </a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">
                            <i class="bi bi-database me-1"></i>业务管理
                        </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="/user">
                                <i class="bi bi-people me-2"></i>用户管理 (单表)
                            </a></li>
                            <li><a class="dropdown-item" href="/order">
                                <i class="bi bi-cart3 me-2"></i>订单管理 (多表)
                            </a></li>
                        </ul>
                    </li>
                </ul>
                <span class="navbar-text text-light">
                    <i class="bi bi-person-circle me-1"></i>Demo User
                </span>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container-fluid py-4">
        <!-- Page Header -->
        <div class="page-header d-flex justify-content-between align-items-center">
            <div>
                <h4><i class="bi bi-hourglass-split me-2 text-warning"></i>待审核列表</h4>
                <p class="text-muted mb-0">审核业务操作请求，通过后数据将正式生效</p>
            </div>
            <div>
                <button class="btn btn-outline-secondary" onclick="location.reload()">
                    <i class="bi bi-arrow-clockwise me-1"></i>刷新
                </button>
            </div>
        </div>

        <!-- Filter -->
        <div class="card mb-4">
            <div class="card-body py-2">
                <form class="row g-2 align-items-center" method="get">
                    <div class="col-auto">
                        <label class="col-form-label">业务类型:</label>
                    </div>
                    <div class="col-auto">
                        <select class="form-select form-select-sm" name="businessType" onchange="this.form.submit()">
                            <option value="">全部</option>
                            <option value="USER_MGMT" th:selected="${businessType == 'USER_MGMT'}">用户管理</option>
                            <option value="ORDER_MGMT" th:selected="${businessType == 'ORDER_MGMT'}">订单管理</option>
                        </select>
                    </div>
                </form>
            </div>
        </div>

        <!-- Data Table -->
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <span><i class="bi bi-table me-2"></i>待审核记录</span>
                <span class="badge bg-warning text-dark" th:text="${pageResult.total} + ' 条待处理'"></span>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover mb-0">
                        <thead>
                            <tr>
                                <th width="80">ID</th>
                                <th width="120">业务类型</th>
                                <th>业务描述</th>
                                <th width="100">操作类型</th>
                                <th width="120">提交人</th>
                                <th width="160">提交时间</th>
                                <th width="180">操作</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="item : ${pageResult.records}">
                                <td th:text="${item.id}"></td>
                                <td>
                                    <span class="badge bg-secondary" th:text="${item.businessType == 'USER_MGMT' ? '用户管理' : item.businessType == 'ORDER_MGMT' ? '订单管理' : item.businessType}"></span>
                                </td>
                                <td th:text="${item.businessDesc}"></td>
                                <td>
                                    <span class="badge badge-insert" th:if="${item.operationType == 'INSERT'}">
                                        <i class="bi bi-plus-circle me-1"></i>新增
                                    </span>
                                    <span class="badge badge-update" th:if="${item.operationType == 'UPDATE'}">
                                        <i class="bi bi-pencil me-1"></i>修改
                                    </span>
                                    <span class="badge badge-delete" th:if="${item.operationType == 'DELETE'}">
                                        <i class="bi bi-trash me-1"></i>删除
                                    </span>
                                </td>
                                <td th:text="${item.submitUserName}"></td>
                                <td th:text="${#temporals.format(item.submitTime, 'yyyy-MM-dd HH:mm')}"></td>
                                <td>
                                    <a th:href="@{/audit/detail/{id}(id=${item.id})}" class="btn btn-sm btn-outline-primary btn-action me-1">
                                        <i class="bi bi-eye"></i> 查看
                                    </a>
                                    <button class="btn btn-sm btn-success btn-action me-1" 
                                            th:data-id="${item.id}" onclick="quickApprove(this)">
                                        <i class="bi bi-check-lg"></i> 通过
                                    </button>
                                    <button class="btn btn-sm btn-danger btn-action" 
                                            th:data-id="${item.id}" onclick="showRejectModal(this)">
                                        <i class="bi bi-x-lg"></i> 驳回
                                    </button>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(pageResult.records)}">
                                <td colspan="7">
                                    <div class="empty-state">
                                        <div class="icon"><i class="bi bi-inbox"></i></div>
                                        <p>暂无待审核记录</p>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
            <!-- Pagination -->
            <div class="card-footer bg-white" th:if="${pageResult.pages > 1}">
                <nav>
                    <ul class="pagination justify-content-center mb-0">
                        <li class="page-item" th:classappend="${pageResult.current == 1} ? 'disabled'">
                            <a class="page-link" th:href="@{/audit/pending(page=${pageResult.current - 1}, businessType=${businessType})}">
                                <i class="bi bi-chevron-left"></i>
                            </a>
                        </li>
                        <li class="page-item" th:each="i : ${#numbers.sequence(1, pageResult.pages)}" 
                            th:classappend="${i == pageResult.current} ? 'active'">
                            <a class="page-link" th:href="@{/audit/pending(page=${i}, businessType=${businessType})}" th:text="${i}"></a>
                        </li>
                        <li class="page-item" th:classappend="${pageResult.current == pageResult.pages} ? 'disabled'">
                            <a class="page-link" th:href="@{/audit/pending(page=${pageResult.current + 1}, businessType=${businessType})}">
                                <i class="bi bi-chevron-right"></i>
                            </a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </div>

    <!-- Reject Modal -->
    <div class="modal fade" id="rejectModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="bi bi-x-circle text-danger me-2"></i>驳回审核</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="rejectId">
                    <div class="mb-3">
                        <label class="form-label">驳回原因 <span class="text-danger">*</span></label>
                        <textarea class="form-control" id="rejectRemark" rows="3" placeholder="请输入驳回原因..."></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-danger" onclick="confirmReject()">
                        <i class="bi bi-x-lg me-1"></i>确认驳回
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer mt-auto py-3 bg-light border-top">
        <div class="container text-center text-muted">
            <small>审核管理系统 Demo - 基于注解的通用复核功能演示</small>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/common.js"></script>
    <script>
        let rejectModal;
        
        document.addEventListener('DOMContentLoaded', function() {
            rejectModal = new bootstrap.Modal(document.getElementById('rejectModal'));
        });
        
        async function quickApprove(btn) {
            const id = btn.dataset.id;
            if (!confirm('确定要通过此审核吗？通过后操作将立即执行。')) return;
            
            setButtonLoading(btn, true);
            const result = await apiRequest(`/audit/api/${id}/approve`, 'POST', { remark: '审核通过' });
            setButtonLoading(btn, false);
            
            if (result.success) {
                showToast(result.message, 'success');
                setTimeout(() => location.reload(), 1000);
            } else {
                showToast(result.message, 'error');
            }
        }
        
        function showRejectModal(btn) {
            document.getElementById('rejectId').value = btn.dataset.id;
            document.getElementById('rejectRemark').value = '';
            rejectModal.show();
        }
        
        async function confirmReject() {
            const id = document.getElementById('rejectId').value;
            const remark = document.getElementById('rejectRemark').value.trim();
            
            if (!remark) {
                showToast('请填写驳回原因', 'warning');
                return;
            }
            
            const result = await apiRequest(`/audit/api/${id}/reject`, 'POST', { remark });
            
            if (result.success) {
                showToast(result.message, 'success');
                rejectModal.hide();
                setTimeout(() => location.reload(), 1000);
            } else {
                showToast(result.message, 'error');
            }
        }
    </script>
</body>
</html>
