<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>订单详情 - 审核管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="/">
                <i class="bi bi-shield-check me-2"></i>审核管理系统
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/audit/pending">
                            <i class="bi bi-hourglass-split me-1"></i>待审核
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/audit">
                            <i class="bi bi-list-check me-1"></i>审核记录
                        </a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle active" href="#" data-bs-toggle="dropdown">
                            <i class="bi bi-database me-1"></i>业务管理
                        </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="/user">
                                <i class="bi bi-people me-2"></i>用户管理 (单表)
                            </a></li>
                            <li><a class="dropdown-item active" href="/order">
                                <i class="bi bi-cart3 me-2"></i>订单管理 (多表)
                            </a></li>
                        </ul>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/permission">
                            <i class="bi bi-key me-1"></i>字段权限
                        </a>
                    </li>
                </ul>
                <span class="navbar-text text-light">
                    <i class="bi bi-person-circle me-1"></i>Demo User
                </span>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container-fluid py-4">
        <!-- Page Header -->
        <div class="page-header">
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb mb-1">
                    <li class="breadcrumb-item"><a href="/order">订单管理</a></li>
                    <li class="breadcrumb-item active">订单详情</li>
                </ol>
            </nav>
            <h4><i class="bi bi-receipt me-2 text-primary"></i>订单详情</h4>
        </div>

        <div class="row">
            <div class="col-lg-8">
                <!-- Order Info Card -->
                <div class="card mb-4">
                    <div class="card-header">
                        <i class="bi bi-info-circle me-2"></i>订单信息
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-6 mb-3" data-field="orderNo">
                                <label class="form-label text-muted">订单号</label>
                                <div><code class="fs-5" th:text="${order.orderNo}"></code></div>
                            </div>
                            <div class="col-md-6 mb-3" data-field="status">
                                <label class="form-label text-muted">订单状态</label>
                                <div>
                                    <span class="badge bg-warning text-dark fs-6" th:if="${order.status == 0}">待确认</span>
                                    <span class="badge bg-info fs-6" th:if="${order.status == 1}">已确认</span>
                                    <span class="badge bg-primary fs-6" th:if="${order.status == 2}">已发货</span>
                                    <span class="badge bg-success fs-6" th:if="${order.status == 3}">已完成</span>
                                    <span class="badge bg-secondary fs-6" th:if="${order.status == 4}">已取消</span>
                                </div>
                            </div>
                            <div class="col-md-6 mb-3" data-field="customerName">
                                <label class="form-label text-muted">客户名称</label>
                                <div th:text="${order.customerName}"></div>
                            </div>
                            <div class="col-md-6 mb-3" data-field="customerPhone">
                                <label class="form-label text-muted">联系电话</label>
                                <div th:text="${order.customerPhone ?: '-'}"></div>
                            </div>
                            <div class="col-md-12 mb-3" data-field="shippingAddress">
                                <label class="form-label text-muted">收货地址</label>
                                <div th:text="${order.shippingAddress ?: '-'}"></div>
                            </div>
                            <div class="col-md-6 mb-3" data-field="createTime">
                                <label class="form-label text-muted">创建时间</label>
                                <div th:text="${order.createTime != null ? #temporals.format(order.createTime, 'yyyy-MM-dd HH:mm:ss') : '-'}"></div>
                            </div>
                            <div class="col-md-6 mb-3" data-field="remark">
                                <label class="form-label text-muted">备注</label>
                                <div th:text="${order.remark ?: '-'}"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Order Items Card -->
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <span><i class="bi bi-box-seam me-2"></i>商品明细</span>
                        <span class="badge bg-info" th:text="${#lists.size(items)} + ' 个商品'"></span>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table mb-0" id="orderItemsTable">
                                <thead>
                                    <tr>
                                        <th>#</th>
                                        <th data-field="productName">商品名称</th>
                                        <th data-field="specification">规格</th>
                                        <th width="120" data-field="unitPrice">单价</th>
                                        <th width="100" data-field="quantity">数量</th>
                                        <th width="120" data-field="subtotal">小计</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="item, iter : ${items}">
                                        <td th:text="${iter.index + 1}"></td>
                                        <td data-field="productName" th:text="${item.productName}"></td>
                                        <td data-field="specification" th:text="${item.specification ?: '-'}"></td>
                                        <td data-field="unitPrice">¥<span th:text="${#numbers.formatDecimal(item.unitPrice, 1, 2)}"></span></td>
                                        <td data-field="quantity" th:text="${item.quantity}"></td>
                                        <td data-field="subtotal" class="text-danger">¥<span th:text="${#numbers.formatDecimal(item.subtotal, 1, 2)}"></span></td>
                                    </tr>
                                </tbody>
                                <tfoot>
                                    <tr class="table-light" data-field="totalAmount">
                                        <td colspan="5" class="text-end fw-bold">总金额:</td>
                                        <td class="text-danger fw-bold fs-5">
                                            ¥<span th:text="${#numbers.formatDecimal(order.totalAmount, 1, 2)}"></span>
                                        </td>
                                    </tr>
                                </tfoot>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-lg-4">
                <!-- Actions Card -->
                <div class="card">
                    <div class="card-header">
                        <i class="bi bi-gear me-2"></i>操作
                    </div>
                    <div class="card-body">
                        <a href="/order" class="btn btn-outline-secondary w-100 mb-2">
                            <i class="bi bi-arrow-left me-1"></i>返回列表
                        </a>
                        <a th:href="@{/order/edit/{id}(id=${order.id})}" class="btn btn-primary w-100 mb-2">
                            <i class="bi bi-pencil me-1"></i>编辑订单
                        </a>
                        <button class="btn btn-outline-danger w-100" th:data-id="${order.id}" th:data-no="${order.orderNo}" onclick="deleteOrder(this)">
                            <i class="bi bi-trash me-1"></i>删除订单
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer mt-auto py-3 bg-light border-top">
        <div class="container text-center text-muted">
            <small>审核管理系统 Demo - 基于注解的通用复核功能演示</small>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/common.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Apply field permissions for both order and order item tables
            applyFieldPermissions('biz_order', ['orderNo', 'customerName', 'customerPhone', 'shippingAddress', 'totalAmount', 'status', 'remark', 'createTime', 'updateTime']);
            applyFieldPermissions('biz_order_item', ['productName', 'specification', 'unitPrice', 'quantity', 'subtotal']);
        });
        
        // Hide fields based on field permissions
        async function applyFieldPermissions(tableName, allFields) {
            try {
                const result = await apiRequest(`/permission/api/queryable/${tableName}`);
                if (!result.success) {
                    console.warn('Failed to fetch field permissions for ' + tableName);
                    return;
                }
                
                const queryableFields = result.data;
                
                // Hide elements for fields that are not queryable
                allFields.forEach(field => {
                    if (!queryableFields.includes(field)) {
                        // Hide all elements with this data-field
                        document.querySelectorAll(`[data-field="${field}"]`).forEach(el => {
                            el.style.display = 'none';
                        });
                    }
                });
            } catch (e) {
                console.warn('Error applying field permissions:', e);
            }
        }
        
        async function deleteOrder(btn) {
            const id = btn.dataset.id;
            const orderNo = btn.dataset.no;
            
            if (!confirm(`确定要删除订单 "${orderNo}" 吗？将同时删除订单明细。删除操作需要审核通过后才会执行。`)) {
                return;
            }
            
            const result = await apiRequest(`/order/api/${id}`, 'DELETE');
            
            if (result.success) {
                showToast(result.message, 'success');
                setTimeout(() => window.location.href = '/order', 1500);
            } else {
                showToast(result.message, 'error');
            }
        }
    </script>
</body>
</html>
